<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Autorização do Mercado Livre</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #ffffff; --tx: #1d2330; --mut: #5b6474;
    --ac: #2d6cdf; --ok: #1f8a4c; --err: #c0392b; --bd: #dde2ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --tx: #e9edf3; --mut: #9aa4b2;
      --ac: #6ea0ff; --ok: #4cc38a; --err: #ff7b6b; --bd: #2c323c;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--tx);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { margin: 8px 0; color: var(--mut); }
  .codigo { font: 600 1.05rem/1.4 ui-monospace, Consolas, monospace; word-break: break-all;
            background: var(--bg); border: 1px solid var(--bd); border-radius: 8px;
            padding: 12px; margin: 16px 0 12px; color: var(--tx); user-select: all; }
  button { font: inherit; font-weight: 600; background: var(--ac); color: #fff; border: 0;
           border-radius: 8px; padding: 12px 18px; cursor: pointer; width: 100%; }
  .ok { color: var(--ok); font-weight: 600; min-height: 1.5em; }
  .erro { color: var(--err); font-weight: 600; }
  small { color: var(--mut); }
</style>
</head>
<body>
<main>
  <div class="card" id="caixa">
    <h1>Autorização do Mercado Livre</h1>
    <p id="msg">Carregando…</p>
  </div>
  <p><small>Esta página só mostra o código que o Mercado Livre devolveu. Ela não guarda nem envia nada.</small></p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), erro = q.get('error'), ref = q.get('state');
  var caixa = document.getElementById('caixa'), msg = document.getElementById('msg');

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt) e.textContent = txt;
    return e;
  }

  // tira o código da barra de endereço e do histórico; ele continua na tela
  if ((code || erro) && history.replaceState) history.replaceState(null, '', location.pathname);

  if (code) {
    msg.textContent = 'Pronto, a autorização foi concedida. Copie o código abaixo e envie agora ao seu contador: ele vale só alguns minutos.';
    if (ref) caixa.appendChild(el('p', '', 'Referência: ' + ref));
    var c = el('div', 'codigo', code);
    caixa.appendChild(c);
    var b = el('button', '', 'Copiar código');
    caixa.appendChild(b);
    var ok = el('p', 'ok', '');
    caixa.appendChild(ok);
    var selecionar = function () {
      var r = document.createRange();
      r.selectNodeContents(c);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      ok.textContent = 'Código selecionado: use o Copiar do seu aparelho.';
    };
    b.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(function () { ok.textContent = 'Código copiado.'; }, selecionar);
      } else {
        selecionar();
      }
    });
  } else if (erro) {
    msg.className = 'erro';
    msg.textContent = 'A autorização não foi concluída (' + erro + '). Se foi engano, abra de novo o link que o seu contador enviou.';
  } else {
    msg.textContent = 'Esta página recebe o retorno da autorização do Mercado Livre. Abra o link que o seu contador enviou.';
  }
})();
</script>
</body>
</html>
